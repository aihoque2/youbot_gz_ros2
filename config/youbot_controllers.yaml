controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_effort_controller:
      type: effort_controllers/JointGroupEffortController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

wheel_effort_controller:
  ros__parameters:
    joints:
      - wheel_joint_fl
      - wheel_joint_fr
      - wheel_joint_bl
      - wheel_joint_br

arm_controller:
  ros__parameters:
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false

gripper_controller:
  ros__parameters:
    joints:
      - gripper_finger_joint_l
      - gripper_finger_joint_r
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity